<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Harsh Verma — social preview</title>
  <style>
    @font-face {
      font-family: "Newsreader";
      font-style: normal;
      font-weight: 600;
      font-display: block;
      src: url("fonts/newsreader-600.woff2") format("woff2");
    }
    @font-face {
      font-family: "Newsreader";
      font-style: italic;
      font-weight: 500;
      font-display: block;
      src: url("fonts/newsreader-500-italic.woff2") format("woff2");
    }
    @font-face {
      font-family: "Public Sans";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("fonts/public-sans-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "Public Sans";
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url("fonts/public-sans-500.woff2") format("woff2");
    }
    @font-face {
      font-family: "Public Sans";
      font-style: normal;
      font-weight: 600;
      font-display: block;
      src: url("fonts/public-sans-600.woff2") format("woff2");
    }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #141311;
      color: #f3eee6;
      font-family: "Public Sans", sans-serif;
    }
    .card {
      box-sizing: border-box;
      height: 630px;
      padding: 72px 76px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(700px 360px at 0% 0%, rgba(231, 194, 164, 0.16), transparent 60%),
        #141311;
      border-top: 8px solid #e7c2a4;
    }
    .kicker {
      margin: 0;
      color: #e7c2a4;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 14px 0 0;
      font-family: "Newsreader", Georgia, serif;
      font-size: 92px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }
    .title {
      margin: 22px 0 0;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .org {
      margin: 6px 0 0;
      color: #b3aa9e;
      font-size: 26px;
    }
    .lede {
      margin: 28px 0 0;
      max-width: 920px;
      font-family: "Newsreader", Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-size: 30px;
      line-height: 1.35;
    }
    .foot {
      display: flex;
      justify-content: space-between;
      color: #b3aa9e;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <p class="kicker">Résumé</p>
      <h1>Harsh Verma</h1>
      <p class="title">Software Development Engineer 2</p>
      <p class="org">Expedia Group · Gurgaon, India</p>
      <p class="lede">Software engineer focused on data platforms and distributed systems.</p>
    </div>
    <p class="foot">
      <span>harshverma3305@gmail.com</span>
      <span>harsh3305.github.io/MyResume</span>
    </p>
  </div>
</body>
</html>
